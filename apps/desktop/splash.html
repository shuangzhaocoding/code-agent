<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Code Agent</title>
  <style>
    :root,
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #121218;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #5b9fff;
      --accent-soft: color-mix(in srgb, var(--accent) 28%, transparent);
      --titlebar-h: 38px;
      --titlebar-border: rgba(255, 255, 255, 0.06);
      --mark-bg: linear-gradient(145deg, #1a2230, #12161d);
      --mark-border: rgba(255, 255, 255, 0.06);
      --mark-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --detail: #7a8088;
      --glow: rgba(91, 159, 255, 0.12);
    }
    html[data-theme='light'] {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --accent: #4f6bff;
      --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent);
      --titlebar-border: rgba(0, 0, 0, 0.07);
      --mark-bg: linear-gradient(145deg, #f4f4f5, #e4e4e7);
      --mark-border: rgba(0, 0, 0, 0.08);
      --mark-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      --detail: #a1a1aa;
      --glow: rgba(79, 107, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .titlebar {
      display: none;
      height: var(--titlebar-h);
      align-items: center;
      padding: 0 0 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--titlebar-border);
      -webkit-app-region: drag;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    body.custom-titlebar .titlebar { display: flex; }
    body.needs-window-controls .titlebar {
      padding-right: 0;
    }
    .titlebar-label {
      flex: 1;
      min-width: 0;
    }
    .win-controls {
      display: none;
      align-items: stretch;
      height: 100%;
      margin-left: auto;
      -webkit-app-region: no-drag;
    }
    body.needs-window-controls .win-controls { display: flex; }
    .win-btn {
      width: 46px;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .win-btn:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); }
    .win-btn-close:hover { background: #e81123; color: #fff; }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, var(--glow), transparent 60%),
        var(--bg);
    }
    body.custom-titlebar .wrap {
      min-height: calc(100% - var(--titlebar-h));
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      max-width: 360px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--mark-bg);
      border: 1px solid var(--mark-border);
      box-shadow: var(--mark-shadow);
    }
    .mark svg { width: 28px; height: 28px; stroke: var(--accent); }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-soft);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    .spinner.is-error {
      animation: none;
      border-color: #e11d48;
      border-top-color: #e11d48;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { margin: 0; color: var(--muted); }
    #detail {
      margin: 0;
      color: var(--detail);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow: auto;
      text-align: left;
      width: 100%;
    }
    #detail:empty { display: none; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-label">Code Agent</span>
    <div class="win-controls" aria-hidden="false">
      <button type="button" class="win-btn" id="btn-min" title="Minimize">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="win-btn" id="btn-max" title="Maximize">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.25" y="2.25" width="7.5" height="7.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="win-btn win-btn-close" id="btn-close" title="Close">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </div>
      <h1>Code Agent</h1>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <p id="status">正在启动服务…</p>
      <p id="detail"></p>
    </div>
  </div>
  <script>
    function applySplashTheme(theme) {
      const next = theme === 'light' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
    }
    window.setSplashTheme = applySplashTheme
    try {
      const q = new URLSearchParams(location.search)
      applySplashTheme(q.get('theme') || 'dark')
    } catch {
      applySplashTheme('dark')
    }
    var desktop = window.codeAgentDesktop
    if (desktop && desktop.customTitleBar) {
      document.body.classList.add('custom-titlebar')
    }
    if (desktop && desktop.needsWindowControls) {
      document.body.classList.add('needs-window-controls')
      var min = document.getElementById('btn-min')
      var max = document.getElementById('btn-max')
      var closeBtn = document.getElementById('btn-close')
      if (min) min.onclick = function () { desktop.windowMinimize && desktop.windowMinimize() }
      if (max) max.onclick = function () { desktop.windowMaximizeToggle && desktop.windowMaximizeToggle() }
      if (closeBtn) closeBtn.onclick = function () { desktop.windowClose && desktop.windowClose() }
    }
    window.setSplashStatus = function (text, opts) {
      const status = document.getElementById('status')
      const detail = document.getElementById('detail')
      const spinner = document.getElementById('spinner')
      if (typeof text === 'string') status.textContent = text
      if (opts && typeof opts.detail === 'string') detail.textContent = opts.detail
      if (opts && opts.error) spinner.classList.add('is-error')
    }
  </script>
</body>
</html>
