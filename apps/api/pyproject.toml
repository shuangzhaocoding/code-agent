[project]
name = "code-agent-api"
version = "0.1.0"
description = "Code Agent FastAPI backend"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "tortoise-orm>=0.21.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "cryptography>=43.0.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
redis = ["redis>=5.0.0"]
checkpoint-postgres = ["langgraph-checkpoint-postgres>=2.0.0", "psycopg[binary]>=3.1.0"]
split = ["asyncpg>=0.29.0", "redis>=5.0.0"]
all = ["asyncpg>=0.29.0", "redis>=5.0.0", "langgraph-checkpoint-postgres>=2.0.0", "psycopg[binary]>=3.1.0"]

[project.scripts]
code-agent = "code_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_agent*"]
