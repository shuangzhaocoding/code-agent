server:
  host: 127.0.0.1
  port: 4060
  # Vite dev server port (development only); marked protected alongside API port.
  dev_ui_port: 4061
  # Production: directory with built frontend (index.html). "auto" = apps/web/dist if present.
  static_dir: auto
  cors_origins:
    - http://127.0.0.1:4061
    - http://localhost:4061
    - http://127.0.0.1:4060
    - http://localhost:4060

ports:
  protected: []

paths:
  data_dir: ~/.code-agent/data
  user_config: ~/.code-agent/config.yaml
  user_plugins: ~/.code-agent/plugins
  user_skills: ~/.code-agent/skills
  checkpoint_db: auto

uploads:
  dir: uploads

agent:
  max_steps: 80
  tool_timeout_sec: 90
  run_timeout_sec: 900
  max_tool_output_chars: 12000
  default_mode: agent
  system_prompt_extra: ""
  sliding_window_size: 12
  compress_threshold_tokens: 90000
  use_legacy_react: false
  memory:
    enabled: true
    max_inject: 10
    always_inject_max: 5
    extract_per_run: 5
    always_inject_kinds:
      - profile
      - preference
      - convention
      - goal
      - workflow
    auto_kinds:
      - profile
      - preference
      - goal
      - context
      - workflow
      - decision
      - architecture
      - convention
      - fact
      - bug_fix
      - lesson
      - dependency
      - todo

workspace:
  max_file_bytes: 1048576
  tree_max_children: 400
  grep_max_hits: 200
  # Explorer tree: hide only these. Dotfiles (.env, .gitignore, …) are shown.
  # Dependency dirs (node_modules, venv, …) stay visible here; search still uses default_ignores.
  tree_ignores:
    - .git
    - .code-agent/data
  default_ignores:
    - .git
    - node_modules
    - dist
    - build
    - .venv
    - venv
    - __pycache__
    - .code-agent/data
    - .cursor
    - target
    - coverage

policy:
  auto_run: sandbox
  deny_network: false
  command_blacklist:
    - rm -rf /
    - sudo
    - mkfs
    - shutdown
    - reboot
    - dd if=
    - :(){
    - chmod -R 777 /
  protected_globs:
    - .env
    - .env.*
    - "*.pem"
    - "*.key"
    - id_rsa
    - id_ed25519
    - "*.p12"

terminal:
  shell: ""
  scrollback_bytes: 204800
  default_cols: 120
  default_rows: 32

llm:
  request_timeout_sec: 120
  default_temperature: 0.2

ui:
  theme: dark
  font_size: 13
  send_on_enter: true
