server:
  host: 127.0.0.1
  port: 4060
  # Vite dev server port (development only); marked protected alongside API port.
  dev_ui_port: 4061
  # Production: directory with built frontend (index.html). "auto" = apps/web/dist if present.
  static_dir: auto
  cors_origins:
    - http://127.0.0.1:4061
    - http://localhost:4061
    - http://127.0.0.1:4060
    - http://localhost:4060

ports:
  protected: []

paths:
  data_dir: ~/.code-agent/data
  user_config: ~/.code-agent/config.yaml
  user_plugins: ~/.code-agent/plugins
  user_skills: ~/.code-agent/skills
  checkpoint_db: auto

uploads:
  dir: uploads

agent:
  max_steps: 80
  # Max LangGraph runs executing at once (others stay queued until a slot frees).
  max_concurrent_runs: 2
  tool_timeout_sec: 90
  run_timeout_sec: 900
  max_tool_output_chars: 12000
  default_mode: agent
  system_prompt_extra: ""
  sliding_window_size: 12
  compress_threshold_tokens: 90000
  use_legacy_react: false
  checkpoint_cleanup:
    enabled: true
    # delete: drop thread checkpoints when a run ends (UI history stays in Message DB)
    on_run_end: delete
    orphan_on_startup: true
    vacuum_after_bulk: true
  memory:
    enabled: true
    max_inject: 10
    always_inject_max: 5
    extract_per_run: 5
    always_inject_kinds:
      - profile
      - preference
      - convention
      - goal
      - workflow
    auto_kinds:
      - profile
      - preference
      - goal
      - context
      - workflow
      - decision
      - architecture
      - convention
      - fact
      - bug_fix
      - lesson
      - dependency
      - todo

workspace:
  max_file_bytes: 1048576
  tree_max_children: 400
  grep_max_hits: 200
  # Explorer tree: hide only these. Dotfiles (.env, .gitignore, …) are shown.
  # Dependency dirs (node_modules, venv, …) stay visible here; search still uses default_ignores.
  tree_ignores:
    - .git
    - .code-agent/data
  default_ignores:
    - .git
    - node_modules
    - dist
    - build
    - .venv
    - venv
    - __pycache__
    - .code-agent/data
    - .cursor
    - target
    - coverage

policy:
  auto_run: sandbox
  deny_network: false
  # Sandbox auto_run: commands matching these globs run without approval.
  command_whitelist:
    - pwd
    - ls
    - ls *
    - cat *
    - npm run *
    - npm test
    - npm test *
    - npx *
    - python *
    - python3 *
    - pytest *
    - make *
    - git status*
    - git diff*
    - git log*
  command_blacklist:
    - rm -rf /
    - sudo
    - mkfs
    - shutdown
    - reboot
    - dd if=
    - :(){
    - chmod -R 777 /
  protected_globs:
    - .env
    - .env.*
    - "*.pem"
    - "*.key"
    - id_rsa
    - id_ed25519
    - "*.p12"

terminal:
  shell: ""
  scrollback_bytes: 204800
  default_cols: 120
  default_rows: 32

llm:
  request_timeout_sec: 120
  default_temperature: 0.2

ui:
  theme: dark
  font_size: 13
  send_on_enter: true

# Phase 2 — multi-process runtime (split = default)
runtime:
  profile: split  # monolith | split
  agent_worker:
    mode: auto  # auto | inline | external — external when profile=split
    host: 127.0.0.1
    port: 4064
  terminal:
    mode: standalone  # inline | standalone
    host: 127.0.0.1
    port: 4062
  preview:
    mode: standalone  # inline | standalone
    host: 127.0.0.1
    port: 4063

# Phase 3 — storage backends (user configurable)
storage:
  database: sqlite  # sqlite | postgres
  postgres_url: ""  # postgres://user:pass@127.0.0.1:5432/code_agent
  events: sqlite  # sqlite (DB poll) | redis (pub/sub, lower latency in split mode)
  redis_url: ""  # 例：redis://127.0.0.1:6379/0
  checkpoint: sqlite  # sqlite | postgres
  checkpoint_postgres_url: ""  # defaults to postgres_url when empty
